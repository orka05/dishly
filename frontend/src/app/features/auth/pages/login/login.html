<app-auth-layout title="Login">
  @if (notice) {
    <p class="auth-alert auth-alert--success" role="status">{{ notice }}</p>
  }

  <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <app-text-field
      formControlName="identifier"
      label="Email Address / Username"
      autocomplete="username"
    />

    <div>
      <app-text-field
        formControlName="password"
        label="Password"
        type="password"
        autocomplete="current-password"
      />
      <a class="link forgot-password" routerLink="/forgot-password">Forgot Password?</a>
    </div>

    <button type="submit" class="btn btn-primary auth-form__submit" [disabled]="form.invalid">
      Login
    </button>
  </form>

  <div class="auth-divider">Or</div>

  <app-google-button label="Login with Google" />

  <p class="auth-footer">Not a member? <a class="link" routerLink="/sign-up">Sign Up</a></p>
</app-auth-layout>
