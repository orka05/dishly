<app-auth-layout title="Sign up">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <app-text-field formControlName="username" label="Username" autocomplete="username" />

    <app-text-field
      formControlName="email"
      label="Email Address"
      type="email"
      autocomplete="email"
    />

    <app-text-field
      formControlName="password"
      label="Password"
      type="password"
      autocomplete="new-password"
    />

    <app-text-field
      formControlName="confirmPassword"
      label="Password (repeat)"
      type="password"
      autocomplete="new-password"
    />

    <label class="terms">
      <input type="checkbox" class="terms__checkbox" formControlName="acceptTerms" />
      <span
        >I agree to Dishly's <a class="link" routerLink="/terms">Terms &amp; Conditions</a></span
      >
    </label>

    @if (errorMessage(); as message) {
      <p class="auth-alert auth-alert--error" role="alert">{{ message }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="!canSubmit()">
      {{ submitting() ? 'Creating account...' : 'Create an Account' }}
    </button>
  </form>

  <div class="auth-divider">Or</div>

  <app-google-button label="Sign Up with Google" />

  <p class="auth-footer">Already a member? <a class="link" routerLink="/login">Login</a></p>
</app-auth-layout>
