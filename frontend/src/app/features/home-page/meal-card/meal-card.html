<a class="meal-link" [routerLink]="['/recipes', meal().image]" [attr.aria-label]="meal().title">
  <div class="meal-photo">
    <img
      class="dish-image"
      [src]="'dishly/home/' + meal().image + (meal().hasRankedPhoto && !ranked() ? '-unranked' : '') + '.png'"
      alt=""
    />
  </div>

  <div class="meal-details">
    <p class="meal-title" [title]="meal().title">{{ meal().title }}</p>
    <div class="meal-meta">
      <span [attr.aria-label]="'Rating ' + meal().rating + ' out of 5'">
        <span class="star" aria-hidden="true"></span> {{ meal().rating }}
      </span>
      <span class="meal-time"><span class="clock" aria-hidden="true"></span>{{ meal().minutes }} min</span>
    </div>
  </div>

</a>

<span class="meal-plus" aria-hidden="true"></span>
